<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body>

    <section class="grid grid-cols-2 gap-[15%] justify-around  px-[10%] pt-[5%]">
        <!-- Student login -->
        <div class="flex flex-col gap-10">

            <h1 class="text-5xl font-black text-gray-600">Student LogIn</h1>
            <p class="text-lg text-gray-500">Not a student? <a href="#" id="studentSignUp" class="text-blue-500">sign up</a></p>

            <form action="" class="">
               <div class="space-y-8">
                 <div class="flex items-center gap-5">
                <p><i class="fa-regular fa-user"></i></p> 
               <input type="email" name="email" id="email" placeholder="Enter your email here" class="border-0 border-b-2 border-b-gray-400 pb-2 outline-0 w-full"></div> <br>

                <div class="flex items-center gap-5">
                 <p><i class="fa-solid fa-user-lock"></i></p> 
                 <input type="password" name="password" id="pass" placeholder="Enter your password" class="border-0 border-b-2 border-b-gray-400 pb-2 outline-0 w-full"></div>
               </div>
<!-- Reminder of password -->
                <div class="flex justify-between items-center pt-5 pb-16">
                    <p><a href="%" class="text-blue-500">Forgotten password?</a></p>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="check" id="check">
                        <label for="check">Remind me</label>
                    </div>
                </div>

                <input type="submit" name="Login" id="login" class="bg-green-500 w-full text-white rounded-2xl py-5">
            </form>
        </div>



<!-- Staff login form -->

        <div class="flex flex-col gap-10">
            <h1 class="text-5xl font-black text-gray-600">Staff LogIn</h1>
            <p class="text-lg text-gray-500">Not a Staff? <a href="#" id="studentSignUp" class="text-blue-500">sign up</a></p>

            <form action="" class="">
                <div class="space-y-8">
                     <div class="flex items-center gap-5">
                    <p><i class="fa-regular fa-user"></i></p>
                <input type="email" name="email" id="email" placeholder="Enter your email here" class="border-0 border-b-2 border-b-gray-400 pb-2 outline-0 w-full"> </div><br>

               <div class="flex items-center gap-5">
            <p><i class="fa-solid fa-user-lock"></i> </p>
               <input type="password" name="password" id="pass" placeholder="Enter your password" class="border-0 border-b-2 border-b-gray-400 pb-2 outline-0 w-full">
               </div>
                </div>
<!-- Reminder of password -->
                <div class="flex justify-between items-center pt-5 pb-16">
                    <p><a href="%" class="text-blue-500">Forgotten password?</a></p>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" name="" id="checked">
                        <label for="checked" name="">Remind me</label>
                    </div>
                </div>

                <input type="submit" name="Login" id="login" class="bg-gray-500 w-full text-white rounded-2xl py-5">
            </form>
        </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
